name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flagwire/example-nextjs exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Pack release artifacts
        run: node scripts/pack-release.mjs
      - name: Verify release artifacts
        run: node scripts/verify-release.mjs
      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: node scripts/publish-release.mjs
